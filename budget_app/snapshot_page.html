<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly Financial Snapshots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Tokens: canonical names from DESIGN.md (Century Budget System). Century red is the brand mark only. */
:root {
  --ink:#2d2520; --ink-2:#4a3f35; --cream:#f5f3f1; --surface:#ffffff; --surface-warm:#f5f0eb;
  --tan:#c4b5a6; --tan-muted:#a89888; --label:#8b7b6b; --border:#e8e0d8; --rule:#ddd5cc;
  --brand:#a4262c;
  --ok:#065f46; --ok-bg:#def7ec; --ok-bd:#a7f3d0;
  --warn:#a16207; --warn-bg:#fef3c7; --warn-bd:#fde68a;
  --bad:#991b1b; --bad-bg:#fef2f2; --bad-bd:#fecaca;
  --info:#1e3a8a; --info-bg:#eff6ff; --info-bd:#bfdbfe;
  --setup:#7d7468; --setup-bg:#f1f0ec; --setup-bd:#e0dcd2;
  --radius:10px; --radius-lg:12px; --radius-sm:6px; --gap:14px; --gap-lg:20px;
  --shadow:0 1px 2px rgba(45,37,32,0.04); --lift:0 4px 16px rgba(45,37,32,0.06);
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
* { box-sizing:border-box }
html, body { margin:0 }
body { background:var(--cream); color:var(--ink-2); font:14px/1.5 var(--font) }
select, input, textarea, button { font:inherit; color:inherit }
a { color:var(--ink) }
:focus-visible { outline:2px solid var(--ink); outline-offset:2px }

/* navbar */
.nav { position:sticky; top:0; z-index:10; background:var(--ink); color:var(--cream); display:flex; align-items:center; gap:16px; padding:0 24px; min-height:56px; flex-wrap:wrap }
.brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px; color:var(--cream); text-decoration:none }
.brand-mark { width:22px; height:22px; border-radius:5px; background:var(--brand); display:grid; place-items:center; font-size:12px; font-weight:800; color:#fff }
.brand small { font-weight:500; color:var(--tan-muted); font-size:13px }
.test { font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; background:rgba(245,158,11,.18); color:#fcd34d; padding:3px 10px; border-radius:99px }
.who { margin-left:auto; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--tan-muted) }
.who b { color:var(--cream); font-weight:600 }
.who a { color:var(--tan) }
.who select { background:#3d342c; border:1px solid #5a4d42; color:var(--cream); border-radius:var(--radius-sm); padding:7px 10px; min-height:36px }
.nav .ghost { background:transparent; border:1px solid #5a4d42; color:var(--tan); border-radius:var(--radius-sm); padding:7px 12px; cursor:pointer; min-height:36px }
.nav .ghost:hover { border-color:var(--tan); color:var(--cream) }
.signin { display:inline-flex; align-items:center; gap:8px; background:var(--cream); color:var(--ink) !important; text-decoration:none; font-weight:600; padding:8px 14px; border-radius:var(--radius-sm); min-height:36px }
.signin:hover { background:#fff }
.ms { display:grid; grid-template-columns:7px 7px; gap:1px }
.ms i { width:7px; height:7px; display:block }

/* layout */
main { display:grid; grid-template-columns:300px minmax(0,1fr); gap:var(--gap-lg); padding:24px; max-width:1560px; margin:0 auto }
@media (max-width:960px) { main { grid-template-columns:minmax(0,1fr); padding:16px } }
main > * { min-width:0 }
select.ctl { max-width:100%; text-overflow:ellipsis }
.panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow) }
.pad { padding:20px }
.label { font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--label); margin:0 0 12px }
.muted { color:var(--label); font-size:13px }
.banners { display:grid; gap:10px; margin-bottom:var(--gap) }
.banners:empty { display:none }

/* rail */
aside { display:grid; gap:var(--gap); align-content:start; position:sticky; top:76px }
@media (max-width:960px) { aside { position:static; order:1 } }  /* narrow screens: the review queue comes first */
.list { display:grid; gap:8px }
.item { all:unset; box-sizing:border-box; cursor:pointer; display:grid; gap:4px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); transition:border-color .15s, box-shadow .15s }
.item:hover { border-color:var(--tan); box-shadow:var(--lift) }
.item.on { border-color:var(--ink); box-shadow:inset 3px 0 0 var(--ink) }
.item .t { font-weight:600; color:var(--ink); line-height:1.3 }
.item .m { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; color:var(--label) }
.item:focus-visible { outline:2px solid var(--ink); outline-offset:2px }
.field { display:grid; gap:6px; margin-bottom:12px }
.field > span { font-size:13px; font-weight:600; color:var(--ink) }
select.ctl, input.ctl, textarea { width:100%; border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-sm); padding:9px 11px; min-height:40px }
select.ctl:hover, input.ctl:hover, textarea:hover { border-color:var(--tan) }
textarea { line-height:1.5; resize:vertical }
.drop { display:grid; gap:2px; place-items:center; text-align:center; border:1.5px dashed var(--rule); border-radius:var(--radius); padding:14px; cursor:pointer; background:var(--surface-warm); color:var(--ink-2); font-size:13px }
.drop:hover, .drop:focus-within { border-color:var(--tan) }
.drop b { color:var(--ink); font-weight:600 }
.drop input { position:absolute; width:1px; height:1px; opacity:0 }

/* buttons */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 18px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface-warm); color:var(--ink); font-weight:600; cursor:pointer; transition:background .15s, border-color .15s, box-shadow .15s }
.btn:hover { border-color:var(--tan); box-shadow:var(--lift) }
.btn.primary { background:var(--ink); border-color:var(--ink); color:var(--cream) }
.btn.primary:hover { background:#3d342c }
.btn.approve { background:var(--ok); border-color:var(--ok); color:#fff }
.btn.approve:hover { background:#054d39 }
.btn.block { width:100% }
.btn:disabled { opacity:.5; cursor:not-allowed; box-shadow:none }

/* pills */
.pill { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:99px; border:1px solid var(--setup-bd); background:var(--setup-bg); color:var(--setup); white-space:nowrap }
.pill.in_signoff, .pill.awaiting_pm { background:var(--info-bg); border-color:var(--info-bd); color:var(--info) }
.pill.changes_requested { background:var(--bad-bg); border-color:var(--bad-bd); color:var(--bad) }
.pill.approved, .pill.released { background:var(--ok-bg); border-color:var(--ok-bd); color:var(--ok) }
.pill.draftnote { background:var(--warn-bg); border-color:var(--warn-bd); color:var(--warn) }

/* header */
.head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:22px 24px }
.eyebrow { font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--label) }
.head h1 { margin:4px 0 4px; font-size:24px; line-height:1.2; font-weight:700; color:var(--ink); text-wrap:balance }
.head .pill { font-size:13px; padding:5px 12px }

/* stepper */
.steps { display:flex; padding:4px 24px 22px; gap:0; overflow-x:auto }
.step { flex:1 1 0; min-width:96px; position:relative; display:grid; justify-items:center; gap:6px; text-align:center; font-size:12.5px; color:var(--label) }
.step::before { content:""; position:absolute; top:13px; left:-50%; right:50%; height:2px; background:var(--border) }
.step:first-child::before { display:none }
.step .dot { position:relative; z-index:1; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; background:var(--surface); border:2px solid var(--border); color:var(--label) }
.step.done .dot { background:var(--ok); border-color:var(--ok); color:#fff }
.step.done::before, .step.now::before { background:var(--ok) }
.step.now .dot { background:var(--ink); border-color:var(--ink); color:var(--cream); box-shadow:0 0 0 4px rgba(45,37,32,.1) }
.step.now { color:var(--ink); font-weight:600 }
.step.done { color:var(--ink-2) }
.waiting { margin:-8px 24px 20px; font-size:13px; color:var(--ink-2); text-align:center }
.waiting b { color:var(--ink) }

/* columns */
.cols { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:var(--gap-lg); margin-top:var(--gap-lg); align-items:start }
@media (max-width:1280px) { .cols { grid-template-columns:1fr } }
.stack { display:grid; gap:var(--gap-lg) }
.preview { position:sticky; top:76px }
@media (max-width:1280px) { .preview { position:static } }
.preview iframe { display:block; width:100%; height:calc(100vh - 170px); min-height:620px; border:0; border-top:1px solid var(--border); border-radius:0 0 var(--radius-lg) var(--radius-lg); background:#fff }
.preview .bar { display:flex; justify-content:space-between; align-items:center; padding:14px 20px }
.preview .bar a { font-size:13px; font-weight:600; text-decoration:none }

/* sign-off */
.sig { display:grid; grid-template-columns:150px minmax(0,1fr); gap:12px; align-items:start; padding:12px 0; border-top:1px solid var(--border) }
.sig:first-of-type { border-top:0; padding-top:0 }
.sig .r { font-weight:600; color:var(--ink) }
.sig .who2 { font-size:13px; color:var(--label); margin-top:3px }
.sig .quote { font-size:13px; color:var(--ink-2); margin-top:6px; padding-left:10px; border-left:2px solid var(--rule) }
.decide { margin-top:16px; padding:16px; border-radius:var(--radius); background:var(--surface-warm); border:1px solid var(--border); display:grid; gap:10px }
.decide .row { display:flex; gap:10px; flex-wrap:wrap }
.decide .row .btn { flex:1 1 160px }

/* messages */
.msg { border-radius:var(--radius); padding:12px 14px; font-size:13.5px; border:1px solid var(--warn-bd); background:var(--warn-bg); color:#713f12 }
.msg.err { background:var(--bad-bg); border-color:var(--bad-bd); color:var(--bad) }
.msg.okk { background:var(--ok-bg); border-color:var(--ok-bd); color:var(--ok) }
.msg.info { background:var(--info-bg); border-color:var(--info-bd); color:var(--info) }
.paths { font-size:12.5px; margin-top:6px; word-break:break-word; opacity:.9 }

/* checks */
details.checks summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; font-weight:600; color:var(--ink) }
details.checks summary::-webkit-details-marker { display:none }
details.checks summary .chev { margin-left:auto; color:var(--label); font-size:13px; font-weight:500 }
details.checks[open] summary .chev::after { content:" (hide)" }
.badge { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:14px; font-weight:800; flex:none }
.badge.ok { background:var(--ok-bg); color:var(--ok) }
.badge.bad { background:var(--bad-bg); color:var(--bad) }
.chklist { margin-top:14px; display:grid }
.chk { display:grid; grid-template-columns:22px 1fr; gap:8px; padding:7px 0; border-top:1px solid var(--border); font-size:13.5px }
.chk .g { font-weight:800 }
.g.ok { color:var(--ok) } .g.bad { color:var(--bad) } .g.rev { color:var(--warn) }
.chk .d { font-size:13px; color:var(--label) }

/* commentary */
.com { display:grid; gap:6px; margin-bottom:16px }
.com .ct { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-weight:600; color:var(--ink) }
.com p { margin:0 }
.edit-foot { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:4px }

.note { border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; display:grid; gap:8px; background:var(--surface) }
.note.done { border-color:var(--ok-bd); background:#fbfefc }
.note .ct { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-weight:600; color:var(--ink) }
.note .foot { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.note .foot .btn { min-height:38px; padding:0 14px }
.note .stamp { font-size:13px; color:var(--ok); font-weight:600 }
.note .hint { font-size:13px; color:var(--warn) }
.pill.sugg { background:var(--info-bg); border-color:var(--info-bd); color:var(--info) }
details.ev { border-top:1px solid var(--border); padding-top:6px; font-size:12.5px }
details.ev summary { cursor:pointer; color:var(--ink); font-weight:600; font-size:13px }
.eva { margin-top:10px }
.evh { display:flex; justify-content:space-between; gap:8px; color:var(--ink) }
.evh .bad { color:var(--bad); font-variant-numeric:tabular-nums }
.evbars { display:flex; align-items:flex-end; gap:4px; height:52px; margin:4px 0 2px }
.evbars span { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:2px }
.evbars i { display:block; width:100%; background:var(--tan); border-radius:3px 3px 0 0 }
.evbars b { font-size:10px; font-weight:500; color:var(--label) }
.evl { display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-top:1px solid var(--border); color:var(--ink-2) }
.evl span:last-child { font-variant-numeric:tabular-nums; white-space:nowrap }
.note .foot .btn.rm { background:transparent; color:var(--bad); border-color:var(--bad-bd) }
.note .foot .btn.rm:hover { background:var(--bad-bg); box-shadow:none }
details.removed { margin:4px 0 14px; border:1px dashed var(--rule); border-radius:var(--radius); padding:10px 14px }
details.removed summary { cursor:pointer; font-weight:600; color:var(--ink) }
.gone { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0 0; margin-top:10px; border-top:1px solid var(--border) }
.gone b { color:var(--ink-2); text-decoration:line-through; font-weight:600 }
.gone .btn { min-height:36px; padding:0 14px }
.progress { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-2); margin:-4px 0 14px }
.progress .barx { flex:1; height:6px; border-radius:99px; background:var(--surface-warm); overflow:hidden; border:1px solid var(--border) }
.progress .barx i { display:block; height:100%; background:var(--ok) }

/* history */
details.hist summary { cursor:pointer; font-weight:600; color:var(--ink) }
.log { display:grid; gap:6px; margin-top:12px; font-size:13px; color:var(--ink-2) }
.log time { color:var(--label); font-variant-numeric:tabular-nums; margin-right:6px }

/* rail: navigation + grouped queue */
.navbtn { justify-content:flex-start; min-height:40px; background:var(--surface) }
.navbtn.on { border-color:var(--ink); box-shadow:inset 3px 0 0 var(--ink) }
.grp { font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--label); display:flex; justify-content:space-between; margin:10px 0 2px }
.grp:first-of-type { margin-top:0 }
.grp.act { color:var(--brand) }
.item.act { border-left:3px solid var(--brand) }

/* home: the review queue leads; everything else is secondary */
.home { display:grid; gap:var(--gap-lg) }
.focus { border:1px solid var(--border); border-top:4px solid var(--brand); border-radius:var(--radius-lg); background:var(--surface); box-shadow:var(--lift); padding:22px 24px }
.focus h1 { margin:2px 0 4px; font-size:24px; color:var(--ink) }
.rq { display:grid; gap:10px; margin-top:16px }
.rcard { display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:14px 16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface-warm) }
.rcard .t { font-weight:700; color:var(--ink); font-size:15px }
.rcard .btn { margin-left:auto }
.calm { display:flex; gap:12px; align-items:center; margin-top:14px; padding:14px 16px; border-radius:var(--radius); background:var(--ok-bg); border:1px solid var(--ok-bd); color:var(--ok); font-weight:600 }
.later { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:var(--gap-lg) }
.mini { display:grid; gap:6px }
.mini button { all:unset; cursor:pointer; display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-top:1px solid var(--border); font-size:13.5px; color:var(--ink-2) }
.mini button:hover b { text-decoration:underline }
.mini button b { color:var(--ink); font-weight:600 }
.newpanel { max-width:640px }
.newpanel .newform { border-top:1px solid var(--border) }

.empty { display:grid; place-items:center; text-align:center; gap:6px; padding:72px 24px; color:var(--label) }
.empty b { color:var(--ink); font-size:16px }
@media (prefers-reduced-motion:reduce) { * { transition:none !important } }
</style>
</head>
<body>
<header class="nav" role="banner">
  <a class="brand" href="/snapshots"><span class="brand-mark" aria-hidden="true">C</span>Century <small>Monthly Financial Snapshots</small></a>
  <span class="test">Test mode &middot; nothing is published</span>
  <div class="who"><label for="as">Acting as</label><select id="as"></select>
    <button id="reset" class="ghost" title="Delete all test snapshots">Reset test data</button></div>
</header>
<main>
  <aside aria-label="Snapshots">
    <button id="gohome" class="btn block navbtn">&#8962; Review queue</button>
    <button id="gonew" class="btn block navbtn">+ New snapshot</button>
    <div class="panel pad">
      <div id="list" class="list"></div>
    </div>
  </aside>
  <section aria-live="polite">
    <div id="banners" class="banners"></div>
    <div id="detail"></div>
    <div id="newview" hidden>
      <div class="panel newpanel">
        <div class="head"><div><div class="eyebrow">Upload</div><h1>New snapshot</h1>
          <div class="muted">Save the monthly financial statement in the building's Monthly Financials folder first, then upload it here. The snapshot opens for review right away.</div></div></div>
        <div class="pad newform">
          <label class="field"><span>Building</span><select id="gb" class="ctl"></select></label>
          <label class="field" id="gsrow"><span>Sample statement</span><select id="gs" class="ctl"></select></label>
          <div class="field"><span>Monthly financial statement</span>
            <label class="drop" for="gf"><input id="gf" type="file" accept="application/pdf"><b id="gfname">Choose the statement PDF</b><span>from the building's Monthly Financials folder</span></label>
          </div>
          <button id="gen" class="btn primary block">Generate snapshot</button>
          <div id="genmsg" style="margin-top:10px"></div>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
var state = { me: 0, meta: null, cur: null, view: "home", rows: [] };

function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function el(id) { return document.getElementById(id); }
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var STAGE = { draft: "Draft", awaiting_pm: "Waiting on PM", changes_requested: "Changes requested", approved: "Final", released: "Saved" };
var GLYPH = { draft: "&#9998;", awaiting_pm: "&#9719;", changes_requested: "&#10007;", approved: "&#10003;", released: "&#10003;" };
function pill(stage) { return '<span class="pill ' + stage + '">' + GLYPH[stage] + " " + STAGE[stage] + "</span>"; }
function banner(cls, html) { el("banners").insertAdjacentHTML("beforeend", '<div class="msg ' + cls + '">' + html + "</div>"); }

function api(method, url, body) {
  var sep = url.indexOf("?") >= 0 ? "&" : "?";
  var opts = { method: method, headers: {} };
  if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  return fetch(url + sep + "as=" + state.me, opts).then(function (r) {
    return r.json().then(function (j) { if (!r.ok) { throw new Error(j.error || "Something went wrong."); } return j; });
  });
}

var MSLOGO = '<span class="ms" aria-hidden="true"><i style="background:#f25022"></i><i style="background:#7fba00"></i><i style="background:#00a4ef"></i><i style="background:#ffb900"></i></span>';

function init() {
  api("GET", "/api/snapshots/meta").then(function (m) {
    state.meta = m;
    if (m.dev) {
      el("as").innerHTML = m.users.map(function (u) { return '<option value="' + u.id + '">' + esc(u.name) + "</option>"; }).join("");
      state.me = m.users[0].id; el("as").value = state.me;
    } else {
      var q = location.search;
      var who = document.querySelector(".who");
      if (m.me) {
        who.innerHTML = '<span>Signed in as <b>' + esc(m.me.name) + '</b>' + (m.is_admin ? ' <span class="pill approved" style="margin-left:6px">Admin</span>' : "") + "</span>" +
          (m.signout_url ? '<a href="' + m.signout_url + '">Sign out</a>' : "");
      } else if (m.signin_url) {
        who.innerHTML = '<a class="signin" href="' + m.signin_url + '">' + MSLOGO + "Sign in with Microsoft</a>";
      } else {
        who.innerHTML = "<span>Sign-in is not available.</span>";
      }
      if (q.indexOf("signin=unknown") >= 0) { banner("err", "Your Microsoft account is not linked to a user in the budget app. Ask Jacob to add your work email to your user record."); }
      if (q.indexOf("signin=failed") >= 0 || q.indexOf("signin=expired") >= 0) { banner("err", "Sign-in did not complete. Try again."); }
      state.me = m.me ? m.me.id : 0;
      document.querySelector(".test").style.display = "none";
    }
    if (!m.signing_allowed) { banner("", "Sending to PMs is switched off until a secure sign-in is in place. You can generate, review and edit snapshots."); }
    if (m.email_mode !== "live" && !m.dev) { banner("", m.email_mode === "test" ? "Test mode: emails to PMs go to the test inbox, not to the PMs." : "Email is switched off: PMs are not emailed yet."); }
    if (m.dev) { document.querySelector(".who").insertAdjacentHTML("afterbegin", '<a href="/snapshots/dev/outbox" target="_blank" rel="noopener" style="color:var(--tan)">Test outbox</a>'); }
    state.mineOnly = !m.is_admin && (m.my_entities || []).length > 0;  // admins start on every building
    el("gb").innerHTML = m.buildings.map(function (b) { return '<option value="' + b.entity + '">' + esc(b.entity + " – " + b.client) + "</option>"; }).join("");
    if (!m.dev) { el("gsrow").style.display = "none"; }
    el("gs").innerHTML = '<option value="">None, I will upload a PDF</option>' + m.samples.map(function (s) { return "<option>" + esc(s) + "</option>"; }).join("");
    show("home");
    refreshList();
  });
}

// the queue: what needs review comes first, then what waits on the PM, then what is final
var GROUPS = [
  { key: "act", label: "Needs review", stages: ["changes_requested", "draft"] },
  { key: "wait", label: "Waiting on PM", stages: ["awaiting_pm"] },
  { key: "done", label: "Final", stages: ["approved", "released"] }
];
function grouped(rows) {
  var newest = function (a, b) { return (b.year * 12 + b.month) - (a.year * 12 + a.month) || (a.entity < b.entity ? -1 : 1); };
  return GROUPS.map(function (g) {
    var rs = rows.filter(function (r) { return g.stages.indexOf(r.stage) >= 0; }).sort(function (a, b) {
      return g.stages.indexOf(a.stage) - g.stages.indexOf(b.stage) || newest(a, b);
    });
    return { key: g.key, label: g.label, rows: rs };
  });
}
function when(r) { return MONTHS[r.month - 1] + " " + r.year; }

function refreshList() {
  return api("GET", "/api/snapshots").then(function (rows) {
    var mine = (state.meta && state.meta.my_entities) || [];
    var shown = state.mineOnly ? rows.filter(function (r) { return mine.indexOf(r.entity) >= 0; }) : rows;
    state.rows = shown;
    var toggle = mine.length ? '<div class="row" style="display:flex;gap:6px;margin:0 0 12px"><button class="pill' + (state.mineOnly ? " approved" : "") + '" id="fmine" style="cursor:pointer">My buildings</button>' +
      '<button class="pill' + (state.mineOnly ? "" : " approved") + '" id="fall" style="cursor:pointer">All</button></div>' : "";
    var body = grouped(shown).filter(function (g) { return g.rows.length; }).map(function (g) {
      return '<div class="grp' + (g.key === "act" ? " act" : "") + '"><span>' + g.label + "</span><span>" + g.rows.length + "</span></div>" + g.rows.map(function (r) {
        return '<button class="item' + (g.key === "act" ? " act" : "") + (state.cur === r.id ? " on" : "") + '" data-id="' + r.id + '" aria-current="' + (state.cur === r.id) + '"><span class="t">' + esc(r.entity + " \u2013 " + r.client) +
          '</span><span class="m"><span>' + when(r) + " &middot; v" + r.version + "</span>" + pill(r.stage) + "</span></button>";
      }).join("");
    }).join("");
    el("list").innerHTML = toggle + (body || '<div class="muted">' + (state.mineOnly ? "No snapshots for your buildings yet." : "No snapshots yet.") + "</div>");
    Array.prototype.forEach.call(document.querySelectorAll(".item"), function (b) { b.onclick = function () { openSnap(b.getAttribute("data-id")); }; });
    if (el("fmine")) { el("fmine").onclick = function () { state.mineOnly = true; refreshList(); }; el("fall").onclick = function () { state.mineOnly = false; refreshList(); }; }
    if (state.view === "home") { renderHome(); }
  });
}

function show(view) {
  state.view = view;
  if (view !== "snap") { state.cur = null; }
  el("newview").hidden = view !== "new";
  el("detail").hidden = view === "new";
  el("gohome").classList.toggle("on", view === "home");
  el("gonew").classList.toggle("on", view === "new");
}

function renderHome() {
  var g = grouped(state.rows || []);
  var act = g[0].rows, wait = g[1].rows, done = g[2].rows;
  var cards = act.map(function (r) {
    var why = r.stage === "changes_requested" ? "The PM asked for changes. Update the notes and send it back." : "Confirm or edit each note, then send it to the PM.";
    return '<div class="rcard"><div><div class="t">' + esc(r.entity + " \u2013 " + r.client) + '</div><div class="muted">' + when(r) + " &middot; " + why + "</div></div>" +
      pill(r.stage) + '<button class="btn primary" data-open="' + r.id + '">Review now &rarr;</button></div>';
  }).join("");
  function mini(title, rs, note) {
    return '<div class="panel pad"><p class="label">' + title + " (" + rs.length + ")</p>" + (rs.length ? '<div class="mini">' + rs.map(function (r) {
      return '<button data-open="' + r.id + '"><b>' + esc(r.entity + " \u2013 " + r.client) + "</b><span>" + when(r) + "</span></button>";
    }).join("") + "</div>" : '<div class="muted">' + note + "</div>") + "</div>";
  }
  el("detail").innerHTML = '<div class="home"><div class="focus"><div class="eyebrow">' + (state.mineOnly ? "Your buildings" : "All buildings") + "</div>" +
    "<h1>" + (act.length ? act.length + (act.length === 1 ? " snapshot needs" : " snapshots need") + " your review" : "Nothing needs your review") + "</h1>" +
    (act.length ? '<div class="rq">' + cards + "</div>"
      : '<div class="calm">&#10003; You are all caught up. New statements show up here after they are uploaded.</div>') + "</div>" +
    '<div class="later">' + mini("Waiting on the PM", wait, "Nothing is with a PM right now.") + mini("Final", done, "No final snapshots yet.") + "</div></div>";
  Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function (b) { b.onclick = function () { openSnap(b.getAttribute("data-open")); }; });
}

function goHome() { show("home"); renderHome(); refreshList(); }

function openSnap(id) {
  show("snap");
  state.cur = id;
  return api("GET", "/api/snapshots/" + id).then(function (v) { render(v); refreshList(); window.scrollTo(0, 0); });
}

function current(v, role) { return v.signoffs.filter(function (x) { return x.role === role && x.current; }).pop(); }
function teamNames(v, role) { return v.team.filter(function (a) { return a.role === role; }).map(function (a) { return a.name; }).join(" or "); }

function steps(v) {
  var s = v.stage, allTied = v.checks.every(function (c) { return c.status === "tied"; });
  var notesDone = v.commentary.every(function (c) { return c.confirmed; });
  var req = v.request && v.request.current ? v.request : null;
  var done = { gen: true, chk: allTied, notes: notesDone, send: s === "awaiting_pm" || s === "approved" || s === "released",
               pm: s === "approved" || s === "released", save: s === "released" };
  var order = [["gen", "Generated"], ["chk", "Checks tie"], ["notes", "Notes confirmed"], ["send", "Sent to PM"], ["pm", "PM confirms"], ["save", "Saved"]];
  var nowSet = false;
  var html = order.map(function (x, i) {
    var cls = done[x[0]] ? "done" : (!nowSet ? (nowSet = true, "now") : "");
    var mark = done[x[0]] ? "&#10003;" : String(i + 1);
    return '<div class="step ' + cls + '"' + (cls === "now" ? ' aria-current="step"' : "") + '><span class="dot">' + mark + "</span>" + esc(x[1]) + "</div>";
  }).join("");
  var wait = "";
  if (s === "awaiting_pm" && req) { wait = "Emailed to <b>" + esc(req.pms.join(" / ")) + "</b> (PM) on " + esc(req.sent) + ". Due by <b>" + esc(req.due) + "</b>" + (req.overdue ? ' &middot; <span style="color:var(--bad)">overdue</span>' : (req.reminded ? " &middot; reminder sent" : "")); }
  else if (s === "changes_requested") { wait = "The PM asked for changes. Edit the notes, then send it again."; }
  else if (s === "draft") { wait = notesDone ? "Ready. Confirm and send it to the PM." : "Draft. The FA confirms or edits each note, then sends it to the PM."; }
  else if (s === "approved") { wait = "Final: confirmed by the PM." + (v.release_off ? " Saving to SharePoint is switched off." : ""); }
  else if (s === "released") { wait = "Final and saved to the building's Monthly Financials folder."; }
  return '<div class="steps" role="list">' + html + "</div>" + (wait ? '<p class="waiting">' + wait + "</p>" : "");
}

function checksHtml(v) {
  var bad = v.checks.filter(function (c) { return c.status !== "tied"; });
  var rows = v.checks.map(function (c) {
    var g = c.status === "tied" ? '<span class="g ok">&#10003;</span>' : (c.severity === "block" ? '<span class="g bad">&#10007;</span>' : '<span class="g rev">!</span>');
    var extra = "";
    if (c.status !== "tied") {
      extra = '<div class="d">' + esc(c.detail) + "</div>";
      if (c.severity === "review") {
        extra += '<input class="ctl" type="text" data-ack="' + esc(c.id) + '" placeholder="FA note explaining this" value="' + esc(v.acks[c.id] || "") + '" style="margin-top:6px">';
      }
    }
    return '<div class="chk">' + g + "<div>" + esc(c.label) + extra + "</div></div>";
  }).join("");
  var head = bad.length
    ? '<span class="badge bad">!</span>' + bad.length + " of " + v.checks.length + " checks need attention"
    : '<span class="badge ok">&#10003;</span>All ' + v.checks.length + " checks tie to the statement";
  return '<details class="checks"' + (bad.length ? " open" : "") + "><summary>" + head + '<span class="chev">Details</span></summary><div class="chklist">' + rows + "</div></details>";
}

function evidenceHtml(e) {
  if (!e || !e.accounts || !e.accounts.length) { return ""; }
  var m = function (n) { return (n < 0 ? "-$" : "$") + Math.round(Math.abs(n)).toLocaleString("en-US"); };
  var rows = e.accounts.map(function (a) {
    var months = Object.keys(a.actual_by_month || {}), vals = months.map(function (k) { return a.actual_by_month[k]; });
    var top = Math.max.apply(null, vals.concat([1]));
    var bars = months.length ? '<div class="evbars">' + months.map(function (k, i) {
      return '<span title="' + k + " " + m(vals[i]) + '"><i style="height:' + Math.max(2, Math.round(40 * Math.max(0, vals[i]) / top)) + 'px"></i><b>' + k[0] + "</b></span>";
    }).join("") + "</div>" : "";
    var lines = (a.this_month_entries || []).slice(0, 5).map(function (l) {
      return '<div class="evl"><span>' + esc(l.date + " " + l.vendor + (l.remark ? " \u00b7 " + l.remark : "")) + "</span><span>" + m(l.amount) + "</span></div>";
    }).join("");
    return '<div class="eva"><div class="evh"><b>' + esc(a.account) + '</b><span class="bad">' + m(a.ytd_var) + " YTD</span></div>" + bars +
      (lines ? '<div class="muted" style="margin:4px 0 2px">' + esc(e.month) + " entries" + (a.month_complete === false ? " (partial)" : "") + "</div>" + lines : "") + "</div>";
  }).join("");
  return '<details class="ev"><summary>From the GL</summary>' + rows + "</details>";
}

function commentaryHtml(v) {
  var editable = v.can.edit;
  var live = v.commentary.filter(function (c) { return !c.removed; });
  var total = live.length;
  var done = live.filter(function (c) { return c.confirmed; }).length;
  var fa = teamNames(v, "fa") || "the FA";
  var cont = live.filter(function (c) { return c.status === "continuing" && !c.confirmed; }).length;
  var head = '<div class="progress"><span>' + done + " of " + total + ' notes confirmed</span><span class="barx"><i style="width:' + (total ? Math.round(100 * done / total) : 0) + '%"></i></span></div>' +
    (v.can.suggest ? '<div class="foot" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px"><button class="btn" id="suggest" style="min-height:38px">&#10022; Suggest reasons from the GL</button><span class="muted">Drafts a reason for each new note from the ledger. You check and confirm each one.</span></div>' : "") +
    (editable ? "" : '<p class="muted" style="margin:-6px 0 14px">' + esc(fa) + " (FA) edits or confirms each note. " +
      (state.me ? "You can read them here." : "Sign in with Microsoft to edit or confirm them if you are the FA.") + "</p>");
  function statusPill(c) {
    if (c.key === "overall") { return ""; }
    if (c.status === "continuing") { return '<span class="pill">Explained in ' + esc(c.since || "an earlier month") + "</span>"; }
    if (c.status === "worse") { return '<span class="pill changes_requested">Moved: up $' + Math.round(c.moved || 0).toLocaleString("en-US") + " since " + esc(c.since || "earlier") + "</span>"; }
    return '<span class="pill draftnote">New this month</span>';
  }
  function noteHtml(c, i) {
    var stamp = c.confirmed ? '<span class="stamp">&#10003; Confirmed by ' + esc(c.confirmed.by) + " &middot; " + esc(c.confirmed.at) + "</span>" : "";
    var facts = c.facts ? '<p class="muted" style="margin:0">' + esc(c.facts) + "</p>" : "";
    facts += c.suggested && !c.confirmed ? '<div><span class="pill sugg">&#10022; Suggested from the GL &middot; check before confirming</span></div>' : "";
    var ev = evidenceHtml(c.evidence);
    var prior = c.status === "worse" && c.prior_text ? '<p class="muted" style="margin:0"><i>Your ' + esc(c.since || "earlier") + " note:</i> " + esc(c.prior_text) + "</p>" : "";
    if (!editable) {
      var wait = '<span class="pill">&#9719; Waiting on ' + esc(fa) + " to confirm</span>";
      return '<div class="note' + (c.confirmed ? " done" : "") + '"><div class="ct">' + esc(c.title) + statusPill(c) + "</div>" + facts +
        (c.text ? '<p style="margin:0">' + esc(c.text) + "</p>" : "") + ev + '<div class="foot">' + (stamp || wait) + "</div></div>";
    }
    var orig = c.text || "";
    var ph = c.key === "overall" ? "Optional: add context for the board" : (c.status === "new" ? "Add the reason (optional; the line above prints either way)" : "Reason");
    return '<div class="note' + (c.confirmed ? " done" : "") + '"><label class="ct" for="ci' + i + '">' + esc(c.title) + statusPill(c) + "</label>" + facts + prior +
      '<textarea id="ci' + i + '" rows="' + (orig.length > 160 ? 4 : 2) + '" data-ci="' + i + '" data-orig="' + esc(orig) + '" placeholder="' + esc(ph) + '">' + esc(orig) + "</textarea>" + ev +
      '<div class="foot"><button class="btn' + (c.confirmed ? "" : " approve") + '" data-ni="' + i + '"' + (c.confirmed ? " disabled" : "") + ">" +
      (c.confirmed ? "&#10003; Confirmed" : (c.status === "continuing" ? "Still applies" : "Confirm")) + "</button>" +
      (c.key === "overall" ? "" : '<button class="btn rm" data-rm="' + i + '" title="Leave this note out of the snapshot">Remove</button>') + stamp + '<span class="hint" style="display:none">Replace the [bracketed] text with the real cause, then save.</span></div></div>';
  }
  function group(prev, scope) {
    return v.commentary.map(function (c, i) {
      return !c.removed && (c.status === "continuing") === prev && (scope === undefined || (c.scope || null) === scope) ? noteHtml(c, i) : "";
    }).join("");
  }
  function sub(label, hint, html) {
    return html ? '<p class="label" style="margin:16px 0 8px">' + label + (hint ? ' <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">&middot; ' + hint + "</span>" : "") + "</p>" + html : "";
  }
  var gone = v.commentary.map(function (c, i) {
    return c.removed ? '<div class="gone"><div><b>' + esc(c.title) + '</b><div class="muted">Removed by ' + esc(c.removed.by) + " &middot; " + esc(c.removed.at) + "</div></div>" +
      (editable ? '<button class="btn" data-rs="' + i + '">Restore</button>' : "") + "</div>" : "";
  }).join("");
  var removedHtml = gone && editable ? '<details class="removed"><summary>Removed notes (' + v.commentary.filter(function (c) { return c.removed; }).length +
    ')<span class="muted"> &middot; not on the snapshot</span></summary>' + gone + "</details>" : "";
  // new notes: the headline, then year-to-date items, then items over this month only (usually timing)
  var news = group(false, null) + sub("Year to date", "", group(false, "ytd")) +
    sub("This month only", "over this month, within budget for the year (usually timing)", group(false, "month"));
  var prevs = group(true);
  var body = (news || '<p class="muted" style="margin:0 0 14px">No new notes this month.</p>') +
    (prevs ? '<p class="label" style="margin:22px 0 4px">Previous notes</p><p class="muted" style="margin:0 0 12px">Explained in an earlier month and not materially changed since. The reasons carry forward.</p>' +
      (editable && cont ? '<div class="foot" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px"><button class="btn approve" id="bulkcont" style="min-height:38px">&#10003; Confirm all previous notes (' + cont + ")</button></div>" : "") + prevs : "");
  var resolved = (v.resolved && v.resolved.length) ? '<p class="muted" style="margin:0 0 14px">No longer flagged since last month: ' + esc(v.resolved.join(", ")) + ".</p>" : "";
  var note = editable
    ? '<div class="note"><label class="ct" for="bn">Note to the board <span class="muted" style="font-weight:500">optional, prints on the snapshot</span></label><textarea id="bn" rows="2">' + esc(v.board_note) + "</textarea>" +
      '<div class="foot"><button id="saveedit" class="btn">Save board note</button><span class="muted">Changing any wording makes a new version and clears signatures.</span></div></div>'
    : (v.board_note ? '<div class="msg info"><b>Note to the board:</b> ' + esc(v.board_note) + "</div>" : "");
  return head + body + removedHtml + resolved + note;
}

function signHtml(v) {
  var req = v.request && v.request.current ? v.request : null;
  function row(r, label) {
    var last = current(v, r);
    var st, who;
    if (last && last.decision === "approve") {
      st = '<span class="pill approved">&#10003; ' + (r === "fa" ? "Confirmed and sent" : "Confirmed by email") + "</span>";
      who = esc(last.name) + " &middot; " + esc(last.at);
    } else if (last) {
      st = '<span class="pill changes_requested">&#10007; Asked for changes</span>';
      who = esc(last.name) + " &middot; " + esc(last.at);
    } else if (r === "pm" && req) {
      st = '<span class="pill awaiting_pm">&#9719; Email sent, waiting</span>';
      who = esc(req.pms.join(" / ")) + " &middot; due " + esc(req.due);
    } else {
      st = '<span class="pill">&#9719; Waiting</span>';
      who = esc(teamNames(v, r) || "Not assigned");
    }
    var q = last && last.note ? '<div class="quote">&ldquo;' + esc(last.note) + "&rdquo;</div>" : "";
    return '<div class="sig"><div class="r">' + label + '</div><div>' + st + '<div class="who2">' + who + "</div>" + q + "</div></div>";
  }
  var h = row("fa", "Financial Analyst") + row("pm", "Property Manager");
  if (v.problems && v.problems.length) { h += '<div class="msg err" style="margin-top:14px">' + v.problems.map(esc).join("<br>") + "</div>"; }
  if (req && req.emails && req.emails.length) {
    var bad = req.emails.filter(function (e) { return e.status === "failed"; });
    if (bad.length) { h += '<div class="msg err" style="margin-top:14px">The email to ' + esc(bad[bad.length - 1].pm) + " did not go out: " + esc(bad[bad.length - 1].error || "unknown error") + ". Use Resend.</div>"; }
  }
  if (v.stage === "released") {
    return h + '<div class="msg okk" style="margin-top:14px"><b>Saved.</b><div class="paths">' + v.released.files.map(esc).join("<br>") + "</div></div>";
  }
  if (v.stage === "approved") {
    if (v.release_blocked) { h += '<div class="msg" style="margin-top:14px"><b>Final. Saving to SharePoint is on hold.</b><div class="paths">' + esc(v.release_blocked.reason) + "</div></div>"; }
    else if (v.release_off) { h += '<div class="msg info" style="margin-top:14px"><b>Final.</b> Saving to SharePoint is switched off, so nothing was written yet.' + (v.rehearsal ? '<div class="paths">It will go to:<br>' + v.rehearsal.files.map(esc).join("<br>") + "</div>" : "") + "</div>"; }
    if (v.can.release) { h += '<div class="decide"><button id="release" class="btn primary">' + (v.release_blocked ? "Try saving again" : "Save to SharePoint") + "</button></div>"; }
    return h;
  }
  if (v.can.send) {
    h += '<div class="decide"><button id="send" class="btn approve">&#10003; Confirm &amp; send to PM</button><span class="muted">Emails ' +
      esc(teamNames(v, "pm") || "the PM") + " the snapshot with a link to confirm it. They have 48 hours." + (v.email_mode !== "live" ? " (Email is " + esc(v.email_mode) + ".)" : "") + "</span></div>";
  }
  if (v.can.resend) { h += '<div class="decide"><button id="send" class="btn">Resend the email</button><span class="muted">Sends a fresh link. The old one stops working; the 48-hour clock does not restart.</span></div>'; }
  var waitOnly = v.why_not.filter(function (w) { return /^Waiting for/.test(w); });
  var blockers = v.why_not.filter(function (w) { return !/^Waiting for/.test(w); });
  if (blockers.length) { h += '<div class="msg" style="margin-top:14px">' + blockers.map(esc).join("<br>") + "</div>"; }
  if (waitOnly.length) { h += '<p class="muted" style="margin:14px 0 0">&#9719; ' + waitOnly.map(esc).join(" ") + "</p>"; }
  if (!v.can.send && !v.can.resend && !v.why_not.length && v.stage !== "awaiting_pm") {
    h += '<p class="muted" style="margin:14px 0 0">Nothing for you to do on this one' + (v.my_roles.length ? "" : " (you are not on this building's team)") + ".</p>";
  }
  return h;
}

function render(v) {
  var html = '<div class="panel"><div class="head"><div><div class="eyebrow">' + esc(v.entity) + " &middot; " + MONTHS[v.month - 1] + " " + v.year + "</div><h1>" + esc(v.building || v.client) + "</h1>" +
    '<div class="muted">Version ' + v.version + " &middot; generated " + esc(v.generated_at) + " from " + esc(v.source) + "</div></div>" +
    '<div style="display:flex;gap:10px;align-items:center">' + pill(v.stage) + (v.can.delete ? '<button id="delsnap" class="btn" style="min-height:34px;color:var(--bad);border-color:var(--bad-bd)">Delete snapshot</button>' : "") + "</div>" +
    "</div>" + steps(v) + "</div>" +
    '<div id="err"></div><div class="cols"><div class="stack">' +
    '<div class="panel pad"><p class="label">Sign-off</p>' + signHtml(v) + "</div>" +
    '<div class="panel pad">' + checksHtml(v) + "</div>" +
    '<div class="panel pad"><p class="label">New notes</p>' + commentaryHtml(v) + "</div>" +
    '<div class="panel pad"><details class="hist"><summary>History (' + v.log.length + ")</summary><div class=\"log\">" +
    v.log.map(function (l) { return "<div><time>" + esc(l.at) + "</time><b>" + esc(l.who) + "</b> " + esc(l.what) + "</div>"; }).join("") + "</div></details></div>" +
    '</div><div class="panel preview"><div class="bar"><p class="label" style="margin:0">What the board will see</p><a href="/api/snapshots/' + v.id + '/pdf" target="_blank" rel="noopener">Open PDF</a></div>' +
    '<iframe title="Snapshot preview" src="/api/snapshots/' + v.id + "/pdf?v=" + Date.now() + '#toolbar=0&view=FitH"></iframe></div></div>';
  el("detail").innerHTML = html;
  if (v.pm_override) {
    el("detail").insertAdjacentHTML("afterbegin", '<div class="msg info" style="margin-bottom:var(--gap)"><b>Practice run.</b> The PM email for this snapshot goes to ' +
      esc(v.pm_override.name) + " instead of " + esc((v.pm_override.instead_of || []).join(" / ") || "the building's PM") + ".</div>");
  }
  wire(v);
}

function showErr(e) { el("err").innerHTML = '<div class="msg err" style="margin-top:var(--gap-lg)">' + esc(e.message) + "</div>"; el("err").scrollIntoView({ block: "center" }); }
function act(method, url, body) { api(method, url, body).then(function () { return openSnap(state.cur); }).catch(showErr); }

function wire(v) {
  function on(id, fn) { var node = el(id); if (node) { node.onclick = fn; } }
  on("release", function () { act("POST", "/api/snapshots/" + v.id + "/release"); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-rm]"), function (b) {
    b.onclick = function () { act("POST", "/api/snapshots/" + v.id + "/note/remove", { index: Number(b.getAttribute("data-rm")) }); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-rs]"), function (b) {
    b.onclick = function () { act("POST", "/api/snapshots/" + v.id + "/note/restore", { index: Number(b.getAttribute("data-rs")) }); };
  });
  on("suggest", function () {
    var b = el("suggest"); b.disabled = true; b.innerHTML = "Reading the GL and writing suggestions&hellip;";
    api("POST", "/api/snapshots/" + v.id + "/suggest").then(function () { return openSnap(state.cur); }).catch(function (e) { b.disabled = false; b.innerHTML = "&#10022; Suggest reasons from the GL"; showErr(e); });
  });
  on("delsnap", function () {
    if (!window.confirm("Delete the " + MONTHS[v.month - 1] + " " + v.year + " snapshot for " + v.entity + "? This cannot be undone, and any PM link for it stops working.")) { return; }
    api("DELETE", "/api/snapshots/" + v.id).then(goHome).catch(showErr);
  });
  on("bulkcont", function () { act("POST", "/api/snapshots/" + v.id + "/notes/confirm-continuing"); });
  on("send", function () { act("POST", "/api/snapshots/" + v.id + "/send"); });
  on("saveedit", function () {
    // board note only; note wording goes through each note's own button
    act("POST", "/api/snapshots/" + v.id + "/edit", { commentary: JSON.parse(JSON.stringify(v.commentary)), board_note: el("bn").value });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ci]"), function (t) {
    var i = Number(t.getAttribute("data-ci"));
    var btn = document.querySelector('[data-ni="' + i + '"]');
    t.oninput = function () {
      var changed = t.value !== t.getAttribute("data-orig");
      btn.disabled = false;
      btn.className = "btn approve";
      btn.innerHTML = changed ? "Save &amp; confirm" : (v.commentary[i].confirmed ? "&#10003; Confirmed" : "Confirm");
      if (!changed && v.commentary[i].confirmed) { btn.disabled = true; btn.className = "btn"; }
      var hint = t.parentNode.querySelector(".hint");
      if (hint) { hint.style.display = /\[[^\]]+\]/.test(t.value) ? "" : "none"; }
    };
    btn.onclick = function () {
      var changed = t.value !== t.getAttribute("data-orig");
      act("POST", "/api/snapshots/" + v.id + "/note", changed ? { index: i, text: t.value } : { index: i });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ack]"), function (i) {
    i.onchange = function () { api("POST", "/api/snapshots/" + v.id + "/ack", { check_id: i.getAttribute("data-ack"), note: i.value }).then(function () { return openSnap(state.cur); }).catch(showErr); };
  });
}

if (el("as")) { el("as").onchange = function () { state.me = Number(el("as").value); if (state.cur) { openSnap(state.cur); } }; }
if (el("reset")) { el("reset").onclick = function () { api("POST", "/api/snapshots/reset").then(goHome); }; }
el("gohome").onclick = goHome;
el("gonew").onclick = function () { show("new"); refreshList(); };
el("gf").onchange = function () { el("gfname").textContent = el("gf").files[0] ? el("gf").files[0].name : "Choose the statement PDF"; };
el("gen").onclick = function () {
  var fd = new FormData();
  fd.append("entity", el("gb").value); fd.append("sample", el("gs").value); fd.append("as", state.me);
  if (el("gf").files[0]) { fd.append("file", el("gf").files[0]); }
  var b = el("gen"); b.disabled = true; b.textContent = "Reading the statement...";
  el("genmsg").innerHTML = "";
  fetch("/api/snapshots/generate", { method: "POST", body: fd }).then(function (r) {
    return r.json().then(function (j) { if (!r.ok) { throw new Error(j.error); } return j; });
  }).then(function (j) { return openSnap(j.id); })
    .catch(function (e) { el("genmsg").innerHTML = '<div class="msg err">' + esc(e.message) + "</div>"; })
    .then(function () { b.disabled = false; b.textContent = "Generate snapshot"; });
};
init();
</script>
</body>
</html>
