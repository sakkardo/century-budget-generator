<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly Financial Snapshots</title>
<style>
:root{--bg:#f6f4f3;--paper:#fff;--ink:#221f1f;--mute:#6d6564;--line:#e4dedc;--red:#a4262c;--red-soft:#f7e3e2;--good:#2f6b4f;--good-soft:#e1efe7;--warn:#8a5a00;--warn-soft:#f6ecd2;--font:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
header{background:var(--paper);border-top:4px solid var(--red);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:650}
.test{background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:650;padding:2px 8px;border-radius:99px;letter-spacing:.04em}
.who{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px}
select,input,textarea,button{font:inherit}
select,input[type=text],textarea{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 8px;border-radius:4px;min-width:0}
textarea{width:100%;resize:vertical}
button{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:4px;cursor:pointer}
button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button.good{background:var(--good);border-color:var(--good);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:1px}
main{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px}
.card h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.list{display:grid;gap:6px}
.item{border:1px solid var(--line);border-radius:5px;padding:8px 10px;cursor:pointer;display:grid;gap:2px;text-align:left;background:var(--paper)}
.item.on{border-color:var(--red);background:var(--red-soft)}
.item b{font-weight:600}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;font-weight:600;background:var(--line);color:var(--mute)}
.pill.draft{background:var(--line)}.pill.in_signoff{background:var(--warn-soft);color:var(--warn)}.pill.changes_requested{background:var(--red-soft);color:var(--red)}.pill.approved,.pill.released{background:var(--good-soft);color:var(--good)}
.gen{display:grid;gap:8px;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.steps{display:flex;gap:0;flex-wrap:wrap;margin:0 0 14px}
.step{flex:1 1 110px;font-size:12px;padding:7px 10px;border-bottom:3px solid var(--line);color:var(--mute)}
.step.done{border-color:var(--good);color:var(--good);font-weight:600}
.step.now{border-color:var(--red);color:var(--ink);font-weight:650}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:1200px){.cols{grid-template-columns:1fr}}
.stack{display:grid;gap:14px;align-content:start}
iframe{width:100%;height:78vh;min-height:560px;border:1px solid var(--line);border-radius:4px;background:#fff}
.chk{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}
.chk:last-child{border:0}
.ok{color:var(--good);font-weight:700}.bad{color:var(--red);font-weight:700}.rev{color:var(--warn);font-weight:700}
.note{font-size:12px;color:var(--mute)}
.msg{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:8px 10px;font-size:13px}
.msg.err{background:var(--red-soft);color:var(--red)}
.msg.okk{background:var(--good-soft);color:var(--good)}
.com{border-left:3px solid var(--line);padding-left:10px;margin-bottom:10px}
.com.draft{border-color:var(--warn)}
.com b{display:block;font-size:13px;margin-bottom:3px}
.sig{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.log{font-size:12px;color:var(--mute);display:grid;gap:3px;max-height:160px;overflow:auto}
.empty{color:var(--mute);padding:40px 10px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Monthly Financial Snapshots</h1>
  <span class="test">TEST MODE: test people, local files, nothing is published</span>
  <div class="who"><label for="as">Acting as</label><select id="as"></select>
    <button id="reset" title="Delete all test snapshots">Reset test data</button></div>
</header>
<main>
  <aside>
    <div class="card">
      <h2>Snapshots</h2>
      <div id="list" class="list"></div>
      <div class="gen">
        <h2 style="margin-top:14px">New snapshot</h2>
        <label for="gb" class="note">Building</label><select id="gb"></select>
        <label for="gs" class="note">Statement</label><select id="gs"></select>
        <label for="gf" class="note">or upload the statement PDF</label><input id="gf" type="file" accept="application/pdf">
        <button id="gen" class="primary">Generate snapshot</button>
        <div id="genmsg"></div>
      </div>
    </div>
  </aside>
  <section id="detail"><div class="card empty">Pick a snapshot, or generate one from a statement.</div></section>
</main>
<script>
var state = { me: 0, meta: null, cur: null, draft: null };

function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function el(id) { return document.getElementById(id); }
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var STAGE = { draft: "Draft", in_signoff: "In sign-off", changes_requested: "Changes requested", approved: "Approved", released: "Released" };

function api(method, url, body) {
  var sep = url.indexOf("?") >= 0 ? "&" : "?";
  var opts = { method: method, headers: {} };
  if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  return fetch(url + sep + "as=" + state.me, opts).then(function (r) {
    return r.json().then(function (j) { if (!r.ok) { throw new Error(j.error || "Something went wrong."); } return j; });
  });
}

function init() {
  api("GET", "/api/snapshots/meta").then(function (m) {
    state.meta = m;
    if (m.dev) {
      el("as").innerHTML = m.users.map(function (u) { return '<option value="' + u.id + '">' + esc(u.name) + "</option>"; }).join("");
      state.me = m.users[0].id; el("as").value = state.me;
    } else {
      el("as").parentNode.innerHTML = m.me ? 'Signed in as <b>' + esc(m.me.name) + '</b>' : '<span class="msg err">Pick your name on the FA Dashboard first, then reload.</span>';
      state.me = m.me ? m.me.id : 0;
      document.querySelector(".test").style.display = "none";
    }
    if (!m.signing_allowed) { el("detail").insertAdjacentHTML("beforebegin", '<div class="msg" style="margin-bottom:12px">Signing is switched off until a secure sign-in is in place. You can generate, review and edit snapshots, but not sign or release them.</div>'); }
    el("gb").innerHTML = m.buildings.map(function (b) { return '<option value="' + b.entity + '">' + esc(b.entity + " - " + b.client) + "</option>"; }).join("");
    if (!m.dev) { el("gs").style.display = "none"; el("gs").previousElementSibling.style.display = "none"; }
    el("gs").innerHTML = '<option value="">Choose a sample statement</option>' + m.samples.map(function (s) { return '<option>' + esc(s) + "</option>"; }).join("");
    refreshList();
  });
}

function refreshList(keep) {
  return api("GET", "/api/snapshots").then(function (rows) {
    el("list").innerHTML = rows.length ? rows.map(function (r) {
      return '<button class="item' + (state.cur === r.id ? " on" : "") + '" data-id="' + r.id + '"><b>' + esc(r.entity + " - " + r.client) + "</b><span>" +
        MONTHS[r.month - 1] + " " + r.year + ' &middot; v' + r.version + '</span><span><span class="pill ' + r.stage + '">' + STAGE[r.stage] + "</span></span></button>";
    }).join("") : '<div class="note">No snapshots yet.</div>';
    Array.prototype.forEach.call(document.querySelectorAll(".item"), function (b) { b.onclick = function () { openSnap(b.getAttribute("data-id")); }; });
  });
}

function openSnap(id, preserve) {
  state.cur = id;
  return api("GET", "/api/snapshots/" + id).then(function (v) { render(v, preserve); refreshList(); });
}

function steps(v) {
  var s = v.stage, pmOk = v.signoffs.some(function (x) { return x.role === "pm" && x.decision === "approve" && x.current; });
  var allTied = v.checks.every(function (c) { return c.status === "tied"; });
  var list = [
    ["Generated", "done"],
    ["Checks", allTied ? "done" : "now"],
    ["FA sends", v.sent ? "done" : "now"],
    ["PM signs", pmOk ? "done" : (v.sent ? "now" : "")],
    ["FA signs", s === "released" || s === "approved" ? "done" : (pmOk ? "now" : "")],
    ["Released", s === "released" ? "done" : ""]
  ];
  return '<div class="steps">' + list.map(function (x) { return '<div class="step ' + x[1] + '">' + esc(x[0]) + "</div>"; }).join("") + "</div>";
}

function checksHtml(v) {
  return v.checks.map(function (c) {
    var icon = c.status === "tied" ? '<span class="ok">&#10003;</span>' : (c.severity === "block" ? '<span class="bad">&#10007;</span>' : '<span class="rev">!</span>');
    var extra = "";
    if (c.status !== "tied") {
      extra = '<div class="note">' + esc(c.detail) + "</div>";
      if (c.severity === "review") {
        extra += '<input type="text" data-ack="' + esc(c.id) + '" placeholder="FA note explaining this" value="' + esc(v.acks[c.id] || "") + '" style="width:100%;margin-top:4px">';
      }
    }
    return '<div class="chk">' + icon + "<div>" + esc(c.label) + extra + "</div></div>";
  }).join("");
}

function commentaryHtml(v) {
  var editable = v.can.edit;
  var body = v.commentary.map(function (c, i) {
    if (!editable) { return '<div class="com"><b>' + esc(c.title) + "</b>" + esc(c.text) + "</div>"; }
    return '<div class="com' + (c.draft ? " draft" : "") + '"><b>' + esc(c.title) + (c.draft ? ' <span class="pill in_signoff">draft, FA to confirm</span>' : "") +
      '</b><textarea rows="3" data-ci="' + i + '">' + esc(c.text) + "</textarea></div>";
  }).join("");
  var note = editable ? '<label class="note" for="bn">Note to the board (prints on the snapshot)</label><textarea id="bn" rows="2">' + esc(v.board_note) + "</textarea>" :
    (v.board_note ? '<div class="msg"><b>Note to the board:</b> ' + esc(v.board_note) + "</div>" : "");
  var btn = editable ? '<div class="row" style="margin-top:8px"><button id="saveedit">Save changes (makes a new version)</button><span class="note">Saving clears any signatures.</span></div>' : "";
  return body + note + btn;
}

function signHtml(v) {
  function role(r, label) {
    var s = v.signoffs.filter(function (x) { return x.role === r && x.current; });
    var last = s[s.length - 1];
    var team = v.team.filter(function (a) { return a.role === r; }).map(function (a) { return a.name; }).join(" or ");
    var st = last ? (last.decision === "approve" ? '<span class="ok">Approved</span> by ' + esc(last.name) + " &middot; " + esc(last.at) : '<span class="bad">Requested changes</span> by ' + esc(last.name) + " &middot; " + esc(last.at)) : '<span class="note">Waiting</span>';
    if (last && last.note) { st += '<div class="note">&ldquo;' + esc(last.note) + "&rdquo;</div>"; }
    return '<div class="sig"><b>' + label + "</b><div>" + st + '<div class="note">' + esc(team || "not assigned") + "</div></div></div>";
  }
  var h = role("pm", "Property Manager") + role("fa", "Financial Analyst");
  if (v.stale) { h += '<div class="note" style="margin-top:6px">' + v.stale + " earlier signature(s) no longer count because the snapshot changed.</div>"; }
  if (v.stage === "released") {
    h += '<div class="msg okk" style="margin-top:10px">Released. In the real system these two files go to SharePoint (test copies here):<br>' + v.released.files.map(esc).join("<br>") + "</div>";
    return h;
  }
  if (v.can.send) { h += '<div class="row" style="margin-top:10px"><button id="send" class="primary">Send to sign-off</button></div>'; }
  var role_ = v.can.sign_pm ? "pm" : (v.can.sign_fa ? "fa" : "");
  if (role_) {
    var rel = role_ === "fa" ? " Approving releases it to the SharePoint folders." : "";
    h += '<div style="margin-top:10px"><label class="note" for="sn">Note (needed if you request changes)</label><textarea id="sn" rows="2"></textarea>' +
      '<div class="row" style="margin-top:6px"><button class="good" id="appr" data-role="' + role_ + '">Approve as ' + role_.toUpperCase() + '</button><button id="rej" data-role="' + role_ + '">Request changes</button></div>' +
      (rel ? '<div class="note">' + rel + "</div>" : "") + "</div>";
  }
  if (v.why_not.length) { h += '<div class="msg" style="margin-top:10px">' + v.why_not.map(esc).join("<br>") + "</div>"; }
  if (!v.can.send && !role_ && !v.why_not.length) {
    h += '<div class="note" style="margin-top:10px">Nothing for ' + esc(personName(state.me)) + " to do on this one" + (v.my_roles.length ? "" : " (not assigned to this building)") + ".</div>";
  }
  return h;
}

function personName(id) { var u = state.meta.users.filter(function (x) { return x.id === Number(id); })[0]; return u ? u.name : ""; }

function render(v, preserve) {
  var ts = v.stage;
  var html = '<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">' + esc(v.entity) + "</h2><div style=\"font-size:20px;font-weight:650\">" + esc(v.building || v.client) + "</div>" +
    '<div class="note">' + MONTHS[v.month - 1] + " " + v.year + " &middot; version " + v.version + " &middot; from " + esc(v.source) + '</div></div><span class="pill ' + ts + '" style="font-size:13px">' + STAGE[ts] + "</span></div></div>" +
    steps(v) + '<div id="err"></div><div class="cols"><div class="stack">' +
    '<div class="card"><h2>Sign-off</h2>' + signHtml(v) + "</div>" +
    '<div class="card"><h2>Does it tie to the statement?</h2>' + checksHtml(v) + "</div>" +
    '<div class="card"><h2>What changed (commentary)</h2>' + commentaryHtml(v) + "</div>" +
    '<div class="card"><h2>History</h2><div class="log">' + v.log.map(function (l) { return "<div>" + esc(l.at) + " &middot; <b>" + esc(l.who) + "</b> " + esc(l.what) + "</div>"; }).join("") + "</div></div>" +
    '</div><div class="card"><h2>Preview (what the board will see)</h2><iframe title="Snapshot preview" src="/api/snapshots/' + v.id + "/pdf?v=" + Date.now() + '#toolbar=0"></iframe></div></div>';
  el("detail").innerHTML = html;
  wire(v);
}

function showErr(e) { el("err").innerHTML = '<div class="msg err" style="margin-bottom:12px">' + esc(e.message) + "</div>"; window.scrollTo(0, 0); }
function act(method, url, body) { api(method, url, body).then(function () { return openSnap(state.cur); }).catch(showErr); }

function wire(v) {
  function on(id, fn) { var node = el(id); if (node) { node.onclick = fn; } }
  function decide(decision) {
    return function () {
      act("POST", "/api/snapshots/" + v.id + "/sign", { role: this.getAttribute("data-role"), decision: decision, note: el("sn").value });
    };
  }
  on("send", function () { act("POST", "/api/snapshots/" + v.id + "/send"); });
  on("appr", decide("approve"));
  on("rej", decide("request_changes"));
  on("saveedit", function () {
    var com = JSON.parse(JSON.stringify(v.commentary));
    Array.prototype.forEach.call(document.querySelectorAll("[data-ci]"), function (t) { com[Number(t.getAttribute("data-ci"))].text = t.value; });
    act("POST", "/api/snapshots/" + v.id + "/edit", { commentary: com, board_note: el("bn").value });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ack]"), function (i) {
    i.onchange = function () { api("POST", "/api/snapshots/" + v.id + "/ack", { check_id: i.getAttribute("data-ack"), note: i.value }).then(function () { return openSnap(state.cur); }).catch(showErr); };
  });
}

if (el("as")) { el("as").onchange = function () { state.me = Number(el("as").value); if (state.cur) { openSnap(state.cur); } }; }
if (el("reset")) { el("reset").onclick = function () { api("POST", "/api/snapshots/reset").then(function () { state.cur = null; el("detail").innerHTML = '<div class="card empty">Pick a snapshot, or generate one from a statement.</div>'; refreshList(); }); }; }
el("gen").onclick = function () {
  var fd = new FormData();
  fd.append("entity", el("gb").value); fd.append("sample", el("gs").value); fd.append("as", state.me);
  if (el("gf").files[0]) { fd.append("file", el("gf").files[0]); }
  el("genmsg").innerHTML = '<div class="note">Reading the statement...</div>';
  fetch("/api/snapshots/generate", { method: "POST", body: fd }).then(function (r) {
    return r.json().then(function (j) { if (!r.ok) { throw new Error(j.error); } return j; });
  }).then(function (j) { el("genmsg").innerHTML = ""; return openSnap(j.id); })
    .catch(function (e) { el("genmsg").innerHTML = '<div class="msg err">' + esc(e.message) + "</div>"; });
};
init();
</script>
</body>
</html>
